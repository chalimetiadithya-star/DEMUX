<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Churn Prediction Engine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- CJS Shim for Vapi SDK CDN compatibility -->
    <script>
        window.exports = window.exports || {};
        window.module = window.module || { exports: window.exports };
    </script>
    <!-- Vapi AI Web SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/dist/vapi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">ChurnAI</div>
        <div class="nav-links">
            <a href="/" class="nav-link {% if active_page == 'upload' or not active_page %}active{% endif %}">Upload Data</a>
            <a href="/dashboard" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="/customers" class="nav-link {% if active_page == 'customers' %}active{% endif %}">At-Risk Customers</a>
        </div>
    </nav>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Modal Structure for Vapi AI Call -->
    <div id="call-modal" class="modal hidden">
        <div class="modal-content vapi-modal">
            <div class="modal-header">
                <div class="header-title-group">
                    <span class="vapi-badge">Vapi AI Agent</span>
                    <h2 id="modal-customer-name">Call Customer</h2>
                </div>
                <span class="close-modal">&times;</span>
            </div>
            
            <!-- Vapi Credentials & Setup section -->
            <div class="vapi-config-box">
                <div class="config-header" id="config-toggle">
                    <span>⚙️ Vapi AI Connection Settings</span>
                    <span class="toggle-icon" id="toggle-icon">▼</span>
                </div>
                <div class="config-body hidden" id="config-body">
                    <div class="input-group">
                        <label for="vapi-public-key">Vapi Public Key:</label>
                        <input type="password" id="vapi-public-key" placeholder="Paste your Vapi Public Key (e.g. 12345678-abcd...)" />
                    </div>
                    <div class="input-group">
                        <label for="vapi-assistant-id">Vapi Assistant ID:</label>
                        <input type="text" id="vapi-assistant-id" placeholder="Paste your Vapi Assistant ID (e.g. 87654321-dcba...)" />
                    </div>
                    <button class="btn secondary-btn save-vapi-config-btn" id="save-vapi-config">Save Credentials</button>
                </div>
            </div>

            <div class="modal-body">
                <div id="modal-customer-info" class="customer-info-card">
                    <!-- Customer details injected here -->
                </div>

                <!-- Call Control & Status Bar -->
                <div class="call-controls-bar">
                    <div class="call-status-indicator" id="call-status-indicator">
                        <span class="status-dot idle" id="status-dot"></span>
                        <span id="call-status-text">Connecting to Vapi AI Voice Agent...</span>
                    </div>
                    <div class="call-action-btns">
                        <button id="start-vapi-call-btn" class="btn vapi-start-btn hidden">
                            📞 Start Call
                        </button>
                        <button id="stop-vapi-call-btn" class="btn vapi-stop-btn">
                            ⏹️ End Call
                        </button>
                    </div>
                </div>

                <!-- Audio Visualizer / Pulse Animation -->
                <div class="voice-pulse-container hidden" id="voice-pulse-container">
                    <div class="pulse-ring"></div>
                    <div class="pulse-ring delay"></div>
                    <div class="mic-icon">🎙️</div>
                </div>

                <!-- Live Transcript Area -->
                <div class="transcript-container" id="modal-transcript">
                    <!-- Live conversation transcripts injected here -->
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
